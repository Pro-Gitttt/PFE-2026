# ─────────────────────────────────────────────────────────────────
# Gmail SMTP Secret for Notification-Service
# Apply with: kubectl apply -f k8s/secrets/mail-secret.yaml
#
# To update credentials:
#   kubectl create secret generic mail-secret \
#     --from-literal=MAIL_USERNAME=your@gmail.com \
#     --from-literal=MAIL_PASSWORD="your-app-password" \
#     -n apps --dry-run=client -o yaml | kubectl apply -f -
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: mail-secret
  namespace: apps
type: Opaque
data:
  MAIL_USERNAME: dGFyZWsuZ2FkaGdhZGhpQGVkdS5pc2V0Y29tLnRu
  MAIL_PASSWORD: dGJleSBzZm9lIHN0Zmkgd2x5dg==
