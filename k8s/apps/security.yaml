apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: security-service }
  template:
    metadata:
      labels: { app: security-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: security-service
          image: 192.168.56.10:5000/security-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.infra.svc.cluster.local:3306/securitydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: db-secret, key: DB_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secret, key: DB_PASSWORD } }

            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server.infra.svc.cluster.local:8761/eureka/

            # ✅ KEY FIX
            - name: EUREKA_INSTANCE_HOSTNAME
              value: security-service.apps.svc.cluster.local

            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"

            - name: EUREKA_INSTANCE_NONSECUREPORT
              value: "8083"

          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests: { memory: "256Mi", cpu: "150m" }
            limits:   { memory: "512Mi", cpu: "300m" }
---
apiVersion: v1
kind: Service
metadata:
  name: security-service
  namespace: apps
spec:
  type: NodePort
  selector: { app: security-service }
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083