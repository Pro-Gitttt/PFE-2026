server.port=8083
spring.application.name=security-service

spring.datasource.url=jdbc:mysql://mysql.infra.svc.cluster.local:3306/securitydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://eureka-server.infra.svc.cluster.local:8761/eureka/
eureka.instance.prefer-ip-address=true
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# ── Security Policy ─────────────────────────────────────────────
# Minimum score to pass (0-100). Below this → pipeline blocked.
security.policy.min-score=50.0
# Max allowed CRITICAL vulnerabilities before blocking (0 = block on any CRITICAL)
security.policy.max-critical=0
