server.port=8083
spring.application.name=security-service

spring.datasource.url=jdbc:mysql://mysql.infra.svc.cluster.local:3306/securitydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://eureka-server.infra.svc.cluster.local:8761/eureka/
eureka.instance.prefer-ip-address=true
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always