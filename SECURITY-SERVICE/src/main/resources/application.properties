server.port=8083
spring.application.name=security-service

spring.datasource.url=jdbc:mysql://mysql.infra.svc.cluster.local:3306/securitydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://eureka-server.infra.svc.cluster.local:8761/eureka/
eureka.instance.prefer-ip-address=true
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# ── Security Policy ─────────────────────────────────────────────
# Score is calculated from real Trivy + Gitleaks scan results only.
# Block if score drops below 50 (means too many HIGH/CRITICAL vulns)
security.policy.min-score=50
# Block if project has more than 5 CRITICAL vulnerabilities
security.policy.max-critical=5

# ================= MULTIPART =================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
