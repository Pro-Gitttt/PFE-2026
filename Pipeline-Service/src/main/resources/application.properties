spring.application.name=pipeline-service
server.port=8082

# ?? DATABASE ?????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/PFE_2026?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA ???????????????????????????????????????????????????????
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ?? EUREKA ???????????????????????????????????????????????????

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://stb-eureka:8761/eureka/
eureka.instance.prefer-ip-address=true


# ?? FEIGN ?????????????????????????????????????????????????????
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=30000

