version: "3.9"

services:

  # ================= MYSQL =================
  stb-mysql:
    image: mysql:8.0
    container_name: stb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devsecops
    ports:
      - "3306:3306"
    networks:
      - stb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ================= EUREKA =================
  stb-eureka:
    build: ./Eureka-Server
    container_name: stb-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - stb-network

  # ================= AUTH =================
  stb-auth:
    build: ./Auth-Service
    container_name: stb-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      stb-mysql:
        condition: service_healthy
      stb-eureka:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server.infra:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://stb-mysql:3306/devsecops?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED: "false"
    networks:
      - stb-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ================= SECURITY =================
  stb-security:
    build: ./SECURITY-SERVICE
    container_name: stb-security
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      stb-eureka:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server.infra:8761/eureka/
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED: "false"
    networks:
      - stb-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ================= PIPELINE =================
  stb-pipeline:
    build: ./Pipeline-Service
    container_name: stb-pipeline
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      stb-mysql:
        condition: service_healthy
      stb-eureka:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server.infra:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://stb-mysql:3306/devsecops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED: "false"
    networks:
      - stb-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ================= NOTIFICATION =================
  stb-notification:
    build: ./Notification-Service
    container_name: stb-notification
    restart: unless-stopped
    ports:
      - "8087:8087"
    depends_on:
      stb-mysql:
        condition: service_healthy
      stb-eureka:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server.infra:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://stb-mysql:3306/notificationdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED: "false"
      MAIL_PASSWORD: tbey sfoe stfi wlyv
    networks:
      - stb-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ================= GATEWAY =================
  stb-gateway:
    build: ./Gateway
    container_name: stb-gateway
    restart: unless-stopped
    ports:
      - "8084:8084"
    depends_on:
      stb-eureka:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server.infra:8761/eureka/
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED: "false"
    networks:
      - stb-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

# ================= NETWORK =================
networks:
  stb-network:
    driver: bridge