// ── login.component.html ───────────────────────────────────────
<div class="auth-page">
  <div class="auth-card">
 
    <!-- Header -->
    <div class="auth-brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <p class="brand-name">DevSecOps STB</p>
        <p class="brand-sub">Plateforme CI/CD sécurisée</p>
      </div>
    </div>
 
    <h2>Connexion</h2>
    <p class="auth-lead">Accédez à votre plateforme</p>
 
    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
 
      <div class="field">
        <label for="username">Nom d'utilisateur</label>
        <input
          id="username"
          formControlName="username"
          type="text"
          placeholder="Entrez votre username"
          autocomplete="username"
          [class.invalid]="f['username'].touched && f['username'].invalid"
        />
        <span class="field-error"
              *ngIf="f['username'].touched && f['username'].hasError('required')">
          Ce champ est requis
        </span>
        <span class="field-error"
              *ngIf="f['username'].touched && f['username'].hasError('minlength')">
          Minimum 3 caractères
        </span>
      </div>
 
      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="input-group">
          <input
            id="password"
            formControlName="password"
            [type]="showPass() ? 'text' : 'password'"
            placeholder="Minimum 6 caractères"
            autocomplete="current-password"
            [class.invalid]="f['password'].touched && f['password'].invalid"
          />
          <button type="button" class="input-suffix" (click)="togglePass()">
            <svg *ngIf="!showPass()" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPass()" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="field-error"
              *ngIf="f['password'].touched && f['password'].hasError('required')">
          Ce champ est requis
        </span>
      </div>
 
      <div class="api-error" *ngIf="error()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error() }}
      </div>
 
      <button type="submit" class="btn-submit" [disabled]="loading()">
        <span *ngIf="!loading()">Se connecter</span>
        <span *ngIf="loading()" class="spinner"></span>
      </button>
 
    </form>
 
    <p class="auth-footer">
      Pas encore de compte ?
      <a routerLink="/auth/register">Créer un compte</a>
    </p>
 
  </div>
</div>
