# ================= SERVER =================
server.port=8084
spring.application.name=api-gateway

# ================= EUREKA =================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server.infra.svc.cluster.local:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ================= GATEWAY ROUTES =================

# -------- AUTH SERVICE --------
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# -------- PIPELINE SERVICE --------
spring.cloud.gateway.server.webflux.routes[1].id=pipeline-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://pipeline-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/pipeline/**

# -------- EXECUTIONS (also served by pipeline-service) --------
spring.cloud.gateway.server.webflux.routes[5].id=execution-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://pipeline-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/executions/**

# -------- SECURITY SERVICE --------
spring.cloud.gateway.server.webflux.routes[2].id=security-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://security-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/security/**

# -------- NOTIFICATION SERVICE --------
spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**

# -------- PROMETHEUS (proxied through gateway for frontend) --------
spring.cloud.gateway.server.webflux.routes[6].id=prometheus
spring.cloud.gateway.server.webflux.routes[6].uri=http://prometheus.monitoring.svc.cluster.local:9090
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/prometheus/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1

# -------- TEST ROUTE --------
spring.cloud.gateway.server.webflux.routes[4].id=test
spring.cloud.gateway.server.webflux.routes[4].uri=https://httpbin.org
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/test/**

# ================= CORS =================
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].maxAge=3600

# ================= LOGGING =================
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.loadbalancer=INFO
logging.level.reactor.netty=INFO

# ================= ACTUATOR & PROMETHEUS =================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}