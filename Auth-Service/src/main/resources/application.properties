server.port=8081
spring.application.name=auth-service

spring.datasource.url=jdbc:mysql://mysql.infra.svc.cluster.local:3306/authdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://eureka-server.infra:8761/eureka/
eureka.instance.prefer-ip-address=true

jwt.secret=stb-devsecops-platform-jwt-secret-key-2026-minimum-64-characters-required!!
jwt.expiration=28800000
jwt.refresh-expiration=604800000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always