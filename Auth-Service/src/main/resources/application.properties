# ?? JPA ???????????????????????????????????????????????????????
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ?? EUREKA ???????????????????????????????????????????????????
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ?? JWT ???????????????????????????????????????????????????????
# FIX 1: Use a plain UTF-8 string secret ? consistent across ALL services
# Every microservice must have this EXACT same value
# Min 32 chars for HS256, min 64 chars for HS512
# This replaces the Base64 string that caused SignatureException
jwt.secret=stb-devsecops-platform-jwt-secret-key-2026-minimum-64-characters-required!!
# FIX 2: 8 hours instead of 1 hour ? prevents expired token errors during a session
jwt.expiration=28800000
# Refresh token: 7 days
jwt.refresh-expiration=604800000