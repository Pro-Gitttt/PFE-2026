server.port=8081
spring.application.name=auth-service

# ?? DATABASE ?????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/PFE-2026?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
