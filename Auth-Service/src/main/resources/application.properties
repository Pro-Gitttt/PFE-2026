# ================= SERVER =================
server.port=8081
spring.application.name=auth-service

# ================= EUREKA =================
eureka.client.service-url.defaultZone=http://eureka-server.infra.svc.cluster.local:8761/eureka/
eureka.instance.prefer-ip-address=true

# ? FORCE CONSISTENT REGISTRATION NAME
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ================= DATABASE =================
spring.datasource.url=jdbc:mysql://mysql.infra.svc.cluster.local:3306/authdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA =================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================= JWT =================
jwt.secret=stb-devsecops-platform-jwt-secret-key-2026-minimum-64-characters-required!!
jwt.expiration=28800000
jwt.refresh-expiration=604800000

# ================= ACTUATOR =================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always