server.port=8081
spring.application.name=auth-service

# ================= DATABASE =================
spring.datasource.url=jdbc:mysql://stb-mysql:3306/devsecops?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA =================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================= EUREKA =================
eureka.client.service-url.defaultZone=http://stb-eureka:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=auth-service

# ================= JWT =================
jwt.secret=stb-devsecops-platform-jwt-secret-key-2026-minimum-64-characters-required!!
jwt.expiration=28800000
jwt.refresh-expiration=604800000

# ================= ACTUATOR =================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always