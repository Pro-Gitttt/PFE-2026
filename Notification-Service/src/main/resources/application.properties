server.port=8087
spring.application.name=notification-service

# ================= CONFIG =================
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# ================= DATABASE (FIXED) =================
spring.datasource.url=jdbc:mysql://stb-mysql:3306/notificationdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA =================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ================= EUREKA =================
eureka.client.service-url.defaultZone=http://stb-eureka:8761/eureka/
eureka.instance.prefer-ip-address=true

# ================= MAIL =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tarek.gadhgadhi@edu.isetcom.tn
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ================= ACTUATOR =================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always