server.port=8087
spring.application.name=notification-service

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

spring.datasource.url=jdbc:mysql://mysql.infra.svc.cluster.local:3306/notificationdb?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://eureka-server.infra.svc.cluster.local:8761/eureka/
eureka.instance.prefer-ip-address=true

# ── Email (disabled by default; enable via NOTIFICATION_EMAIL_ENABLED=true) ──
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.from=${NOTIFICATION_EMAIL_FROM:noreply@devsecops.local}
notification.email.default-recipient=${NOTIFICATION_EMAIL_RECIPIENT:admin@devsecops.local}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:disabled}
spring.mail.password=${MAIL_PASSWORD:disabled}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Slack (disabled by default) ──
notification.slack.enabled=${NOTIFICATION_SLACK_ENABLED:false}
notification.slack.webhook-url=${NOTIFICATION_SLACK_WEBHOOK:}

# ── Jackson ISO dates ──
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
